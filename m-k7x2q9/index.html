function schForm(id){const x=id&&D.SC.find(y=>y.id===id);form(x?"تعديل الحصة":"حصة جديدة",[{k:"d",l:"اليوم",t:"select",o:[6,0,1,2,3,4,5].map(d=>[d,DN[d]]),v:x?x.dow:6},{k:"s",l:"من الساعة",t:"select",o:HO,v:x?x.start_h:8},{k:"e",l:"إلى الساعة",t:"select",o:HO,v:x?x.end_h:10},{k:"k",l:"النوع",t:"select",o:Object.entries(KN),v:x?x.kind:"lecture"},{k:"en",l:"المادة بالإنجليزي",v:x&&x.subject},{k:"ar",l:"المادة بالعربي",v:x&&x.subject_ar},{k:"l",l:"المحاضر (اختياري)",v:x&&x.lecturer},{k:"p",l:"المكان",v:x&&x.place}],async o=>{const s=+o.s,e=+o.e,d=+o.d;if(!(o.en||o.ar)||e<=s){toast("راجع المادة والوقت");return false}
 const b={day:["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d],time:s+":00-"+e+":00",subject:o.en||o.ar,subject_ar:o.ar,lecturer:o.l,place:o.p,kind:o.k,dow:d,start_h:s,end_h:e};if(!x)b.position=Date.now()%100000000;if(await ok(x?SB.from("schedule").update(b).eq("id",id):SB.from("schedule").insert(b)))refresh()})}
/* ---------- upload ---------- */
function setupDz(fid){const dz=$("dz"),inp=$("uff");dz.onclick=()=>inp.click();inp.onchange=()=>{up([...inp.files],fid);inp.value=""};
 ["dragenter","dragover"].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.add("on")}));["dragleave","drop"].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.remove("on")}));dz.addEventListener("drop",e=>up([...e.dataTransfer.files],fid))}
function up1(f,fid,i){return new Promise(async res=>{const row=$("u"+i),pg=row.querySelector(".pg"),path=crypto.randomUUID()+"-"+f.name.replace(/[^\w.\-]+/g,"_");
 const tok=(await SB.auth.getSession()).data.session.access_token,fd=new FormData();fd.append("cacheControl","3600");fd.append("",f);
 const x=new XMLHttpRequest();x.open("POST",URL_+"/storage/v1/object/files/"+path);x.setRequestHeader("Authorization","Bearer "+tok);x.setRequestHeader("apikey",KEY);
 x.upload.onprogress=e=>{pg.style.width=(e.loaded/e.total*100)+"%"};
 x.onload=async()=>{if(x.status<300){const r=await SB.from("files").insert({folder_id:fid,name:f.name,path,size:f.size});row.querySelector("span").textContent=(r.error?"❌ ":"✅ ")+f.name;res(!r.error)}else{row.querySelector("span").textContent="❌ "+f.name+" ("+x.status+")";res(false)}};
 x.onerror=()=>{row.querySelector("span").textContent="❌ "+f.name;res(false)};x.send(fd)})}
async function up(fs,fid){if(!fs.length)return;$("ups").innerHTML=fs.map((f,i)=>`<div class="upr" id="u${i}"><span>⏳ ${esc(f.name)}</span><div class="pgw"><div class="pg" style="height:100%;width:0;background:var(--pr);transition:width .15s"></div></div></div>`).join("");
 const r=await Promise.all(fs.map((f,i)=>up1(f,fid,i)));toast("تم رفع "+r.filter(Boolean).length+" من "+fs.length);setTimeout(refresh,900)}
init();
</script></body></html>
