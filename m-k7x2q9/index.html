function schForm(id){const x=id&&D.SC.find(y=>y.id===id);form(x?"تعديل الحصة":"حصة جديدة",[{k:"d",l:"اليوم",t:"select",o:[6,0,1,2,3,4,5].map(d=>[d,DN[d]]),v:x?x.dow:6},{k:"s",l:"من الساعة",t:"select",o:HO,v:x?x.start_h:8},{k:"e",l:"إلى الساعة",t:"select",o:HO,v:x?x.end_h:10},{k:"k",l:"النوع",t:"select",o:Object.entries(KN),v:x?x.kind:"lecture"},{k:"en",l:"المادة بالإنجليزي",v:x&&x.subject},{k:"ar",l:"المادة بالعربي",v:x&&x.subject_ar},{k:"l",l:"المحاضر (اختياري)",v:x&&x.lecturer},{k:"p",l:"المكان",v:x&&x.place}],async o=>{const s=+o.s,e=+o.e,d=+o.d;if(!(o.en||o.ar)||e<=s){toast("راجع المادة والوقت");return false}
 const b={day:["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d],time:s+":00-"+e+":00",subject:o.en||o.ar,subject_ar:o.ar,lecturer:o.l,place:o.p,kind:o.k,dow:d,start_h:s,end_h:e};if(!x)b.position=Date.now()%100000000;if(await ok(x?SB.from("schedule").update(b).eq("id",id):SB.from("schedule").insert(b)))refresh()})}
/* ---------- upload ---------- */
function setupDz(fid){const dz=$("dz"),inp=$("uff");dz.onclick=()=>inp.click();inp.onchange=()=>{up([...inp.files],fid);inp.value=""};
 ["dragenter","dragover"].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.add("on")}));["dragleave","drop"].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.remove("on")}));dz.addEventListener("drop",e=>up([...e.dataTransfer.files],fid))}
function put(f,fid,onp){return new Promise(async res=>{const path=crypto.randomUUID()+"-"+f.name.replace(/[^\w.\-]+/g,"_");const ss=(await SB.auth.getSession()).data.session;if(!ss)return res({ok:false,msg:"سجّل دخول تاني"});
 const fd=new FormData();fd.append("cacheControl","3600");fd.append("",f);const x=new XMLHttpRequest();x.open("POST",URL_+"/storage/v1/object/files/"+path);x.setRequestHeader("Authorization","Bearer "+ss.access_token);x.setRequestHeader("apikey",KEY);
 x.upload.onprogress=e=>{if(onp&&e.lengthComputable)onp(e.loaded/e.total)};
 x.onload=async()=>{if(x.status<300){const r=await SB.from("files").insert({folder_id:fid,name:f.name,path,size:f.size});res(r.error?{ok:false,msg:r.error.message}:{ok:true})}else{let m="";try{m=JSON.parse(x.responseText).message||""}catch(e){}res({ok:false,msg:x.status+(m?": "+m:"")})}};
 x.onerror=()=>res({ok:false,msg:"مشكلة اتصال"});x.send(fd)})}
async function up1(f,fid,i){const row=$("u"+i),pg=row.querySelector(".pg"),sp=row.querySelector("span");const r=await put(f,fid,p=>{pg.style.width=(p*100)+"%"});sp.textContent=(r.ok?"✅ ":"❌ ")+f.name+(r.ok?"":" ("+r.msg+")");return r.ok}
async function up(fs,fid){if(!fs.length)return;$("ups").innerHTML=fs.map((f,i)=>`<div class="upr" id="u${i}"><span>⏳ ${esc(f.name)}</span><div class="pgw"><div class="pg" style="height:100%;width:0;background:var(--pr);transition:width .15s"></div></div></div>`).join("");
 let k=0,n=0;const w=async()=>{while(k<fs.length){const i=k++;if(await up1(fs[i],fid,i))n++}};await Promise.all([w(),w(),w(),w()]);toast("تم رفع "+n+" من "+fs.length);setTimeout(refresh,900)}

/* ---------- selection / move ---------- */
const SEL=new Set();
function selbar(){return SEL.size?`<div class="selbar raised"><b>${SEL.size} محدد</b><button class="p" onclick="moveForm()">📁 نقل</button><button class="x" onclick="bulkDel()">🗑 حذف</button><button class="ib" onclick="SEL.clear();syncSel()" aria-label="clear">✕</button></div>`:""}
function syncSel(){const b=$("selbar");if(b)b.innerHTML=selbar();document.querySelectorAll(".ck").forEach(c=>c.checked=SEL.has(c.dataset.id))}
function ckT(id){SEL.has(id)?SEL.delete(id):SEL.add(id);syncSel()}
function ckAll(fid){const ids=D.FI.filter(x=>x.folder_id===fid).map(x=>x.id);const all=ids.every(i=>SEL.has(i));ids.forEach(i=>all?SEL.delete(i):SEL.add(i));syncSel()}
function moveForm(){const ids=[...SEL];if(!ids.length)return;const first=D.FI.find(x=>x.id===ids[0]),cur=first&&fold(first.folder_id);
 openSheet(`<h3>نقل ${ids.length} ملف</h3><label class="fl">المادة</label><select id="mv_s" onchange="mvFill()">${D.S.map(s=>`<option value="${s.id}" ${cur&&s.id===cur.subject_id?"selected":""}>${esc(s.name_ar)}</option>`).join("")}</select><label class="fl">الفولدر</label><select id="mv_f"></select><div class="acts"><button onclick="shut()">إلغاء</button><button class="p" onclick="mvGo()">نقل</button></div>`);mvFill()}
function mvFill(){const sid=$("mv_s").value;$("mv_f").innerHTML=D.F.filter(f=>f.subject_id===sid).map(f=>`<option value="${f.id}">${esc(f.name_ar)}</option>`).join("")}
async function mvGo(){const fid=$("mv_f").value;if(!fid)return toast("اختار فولدر");const ids=[...SEL];if(await ok(SB.from("files").update({folder_id:fid}).in("id",ids))){SEL.clear();shut();toast("تم النقل");refresh()}}
async function bulkDel(){const ids=[...SEL];if(!ids.length||!confirm(`حذف ${ids.length} ملف نهائياً؟`))return;const ps=D.FI.filter(x=>SEL.has(x.id)).map(x=>x.path);if(ps.length)await SB.storage.from("files").remove(ps);if(await ok(SB.from("files").delete().in("id",ids))){SEL.clear();refresh()}}
/* ---------- upload center ---------- */
const nz=s=>String(s).toLowerCase().replace(/[\u064B-\u065F\u0670\u0640]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/[_\-.()\[\]+]+/g," ");
const STOP=new Set(["of","and","for","the","from","with","مادة"]);
const toks=s=>nz(s).split(/\s+/).map(w=>w.replace(/^ال/,"")).filter(w=>w.length>=3&&!STOP.has(w));
const KG=[[/(^| )(lec|lect|lecture|lectures)( |$)|محاضر|(^| )مح( |$)/,/lectur|محاضر/],[/(^| )(sec|section|sections|tutorial)( |$)|سكشن|سيكشن|سكاشن|تدريب/,/section|سكاش|سكشن/],[/(^| )(slide|slides|ppt|pptx|presentation)( |$)|سلايد|عرض/,/slide|سلايد/],[/(^| )(bank|quiz|exam|exams|mcq|question|questions|midterm)( |$)|اسئل|امتحان|بنك|كويز/,/bank|بنك|اسئل|question/]];
let UC=[],UCbusy=false;
const lastMap=()=>{try{return JSON.parse(localStorage.ucLast||"{}")}catch(e){return{}}};
function defFolder(sid){const m=lastMap()[sid];if(m&&fold(m)&&fold(m).subject_id===sid)return m;const f=D.F.find(x=>x.subject_id===sid);return f?f.id:""}
function guess(name,dflt){const base=name.replace(/\.[^.]+$/,""),ext=((name.match(/\.([^.]+)$/)||[])[1]||"").toLowerCase();
 const n=" "+nz(base.replace(/([a-z])([A-Z])/g,"$1 $2").replace(/([a-zA-Z])(\d)/g,"$1 $2").replace(/(\d)([a-zA-Z])/g,"$1 $2"))+" "+ext+" ";const df={};
 D.S.forEach(s=>new Set(toks(s.name_en+" "+s.name_ar)).forEach(w=>df[w]=(df[w]||0)+1));
 let best=null,bs=0;D.S.forEach(s=>{let sc=0;new Set(toks(s.name_en+" "+s.name_ar)).forEach(w=>{if(n.includes(w))sc+=1/df[w]});
  const en=nz(s.name_en).trim(),ar=nz(s.name_ar).trim();if(en.length>3&&n.includes(" "+en+" "))sc+=2;if(ar.length>3&&n.includes(ar))sc+=2;
  const ac=toks(s.name_en).map(w=>w[0]).join("");if(ac.length>=3&&n.includes(" "+ac+" "))sc+=2;
  if(sc>bs){bs=sc;best=s}});
 let g=false,sid=null,fid="";if(best&&bs>=.3){sid=best.id;g=true}
 else if(dflt&&fold(dflt)){sid=fold(dflt).subject_id}
 if(!sid&&D.S[0])sid=D.S[0].id;
 for(const k of KG){if(k[0].test(n)){const f=D.F.find(x=>x.subject_id===sid&&k[1].test(nz(x.name_en+" "+x.name_ar)));if(f){fid=f.id;g=true;break}}}
 if(!fid){fid=(dflt&&fold(dflt)&&fold(dflt).subject_id===sid)?dflt:defFolder(sid)}
 return{sid,fid,g}}
function uploadCenter(){if(!D.F.length)return toast("أضف مادة وفولدر الأول");UC=[];UCbusy=false;
 openSheet(`<h3>⬆️ رفع ملفات</h3><div class="dz" id="ucdz">اختار الملفات أو اسحبها هنا</div><input id="ucf" type="file" multiple hidden><div id="ucl"></div>`);
 const dz=$("ucdz"),inp=$("ucf");dz.onclick=()=>inp.click();inp.onchange=()=>{ucAdd([...inp.files]);inp.value=""};
 ["dragenter","dragover"].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.add("on")}));["dragleave","drop"].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.remove("on")}));dz.addEventListener("drop",e=>ucAdd([...e.dataTransfer.files]));renderUC()}
function ucAdd(fs){const r=route();const dflt=(r[0]==="content"&&r[1]==="f"&&fold(r[2]))?r[2]:(localStorage.lastFid&&fold(localStorage.lastFid)?localStorage.lastFid:"");
 fs.forEach(f=>{const g=(r[0]==="content"&&r[1]==="f"&&fold(r[2]))?{sid:fold(r[2]).subject_id,fid:r[2],g:false}:guess(f.name,dflt);UC.push({f,sid:g.sid,fid:g.fid,g:g.g,st:"idle",msg:"",p:0})});renderUC()}
const sOpts=sid=>D.S.map(s=>`<option value="${s.id}" ${s.id===sid?"selected":""}>${esc(s.name_ar)}</option>`).join("");
const fOpts=(sid,fid)=>D.F.filter(f=>f.subject_id===sid).map(f=>`<option value="${f.id}" ${f.id===fid?"selected":""}>${esc(f.name_ar)}</option>`).join("");
function renderUC(){const el=$("ucl");if(!el)return;const pend=UC.filter(r=>r.st!=="ok").length;
 el.innerHTML=(UC.length>1?`<div class="raised card" style="margin:8px 0;padding:12px"><b>تطبيق على الكل</b><div style="display:flex;gap:6px"><select id="ucas" onchange="$('ucaf').innerHTML=fOpts(this.value,'')">${sOpts(UC[0].sid)}</select><select id="ucaf">${fOpts(UC[0].sid,UC[0].fid)}</select></div><button class="sm" onclick="ucAll()">طبّق على الكل</button></div>`:"")+
 UC.map((r,i)=>`<div class="raised card" style="margin:8px 0;padding:12px"><div class="ahd"><span class="ic" style="width:36px;height:36px;font-size:1.1rem;margin:0">${grp(r.f.name)}</span><div class="n" style="flex:1;min-width:0"><b style="word-break:break-all">${esc(r.f.name)}</b> <span class="mu">${size(r.f.size)}</span></div>${r.st==="ok"?"":`<button class="x sm" onclick="ucDel(${i})" ${UCbusy?"disabled":""}>✕</button>`}</div>
 <div style="display:flex;gap:6px"><select onchange="ucSet(${i},'s',this.value)" ${r.st==="ok"||UCbusy?"disabled":""}>${sOpts(r.sid)}</select><select onchange="ucSet(${i},'f',this.value)" ${r.st==="ok"||UCbusy?"disabled":""}>${fOpts(r.sid,r.fid)}</select></div>
 ${r.g&&r.st==="idle"?`<span class="mu">🤖 مقترح تلقائياً، راجعه</span>`:""}<div class="pgw"><div style="height:100%;width:${r.st==="ok"?100:r.p*100}%;background:var(--pr);transition:width .15s" id="uc_p${i}"></div></div><div class="mu" id="uc_s${i}">${r.st==="ok"?"✅ تم الرفع":r.st==="err"?"❌ "+esc(r.msg):r.st==="up"?"⏳ جاري الرفع...":""}</div></div>`).join("")+
 (UC.length?`<div class="acts stk"><button onclick="shut()">${pend?"إغلاق":"تم"}</button>${pend?`<button class="p" onclick="ucGo()" ${UCbusy?"disabled":""}>رفع ${pend} ملف</button>`:""}</div>`:"")}
function ucSet(i,k,v){const r=UC[i];if(k==="s"){r.sid=v;r.fid=defFolder(v)}else{r.fid=v;r.sid=fold(v).subject_id}r.g=false;renderUC()}
function ucAll(){const s=$("ucas").value,f=$("ucaf").value;UC.forEach(r=>{if(r.st!=="ok"){r.sid=s;r.fid=f;r.g=false}});renderUC()}
function ucDel(i){UC.splice(i,1);renderUC()}
async function ucGo(){if(UCbusy)return;const todo=UC.map((r,i)=>i).filter(i=>UC[i].st!=="ok");if(todo.some(i=>!UC[i].fid))return toast("اختار فولدر لكل الملفات");UCbusy=true;renderUC();let k=0,n=0;
 const w=async()=>{while(k<todo.length){const i=todo[k++],r=UC[i];r.st="up";const s=$("uc_s"+i);if(s)s.textContent="⏳ جاري الرفع...";
  const res=await put(r.f,r.fid,p=>{r.p=p;const b=$("uc_p"+i);if(b)b.style.width=(p*100)+"%"});r.st=res.ok?"ok":"err";r.msg=res.msg||"";if(res.ok){n++;const m=lastMap();m[r.sid]=r.fid;localStorage.ucLast=JSON.stringify(m);localStorage.lastFid=r.fid}const s2=$("uc_s"+i);if(s2)s2.textContent=res.ok?"✅ تم الرفع":"❌ "+res.msg}};
 await Promise.all([w(),w(),w()]);UCbusy=false;toast(`تم رفع ${n} من ${todo.length}`);await load();renderUC()}
/* ---------- zip viewer ---------- */
let Z=null,ZL=[],ZF=null;
const zdec=b=>{b=Uint8Array.from(b);try{return new TextDecoder("utf-8",{fatal:true}).decode(b)}catch(e){try{return new TextDecoder("windows-1256").decode(b)}catch(x){return String.fromCharCode.apply(null,b)}}};
const zsz=e=>(e._data&&e._data.uncompressedSize)||0;
const zJunk=n=>/(^|\/)(__MACOSX|\.DS_Store|Thumbs\.db)(\/|$)/i.test(n);
const zPrevOk=n=>/\.(png|jpe?g|gif|webp|bmp|txt|md|csv|json|xml|log|py|cs|js|ts|java|cpp|c|h|sql|css|html|yml|ini)$/i.test(n);
function openSheet(h){$("sh").innerHTML=`<div class="bk" onclick="shut()"></div><div class="pn form"><div class="hd"></div>${h}</div>`;requestAnimationFrame(()=>$("sh").classList.add("on"))}
async function zipView(id){const x=D.FI.find(y=>y.id===id);ZF=x;openSheet(`<h3>📂 ${esc(x.name)}</h3><p class="mu" id="zs">جاري التحميل...</p><div id="zp"></div><div id="zl"></div>`);
 try{const r=await fetch(SB.storage.from("files").getPublicUrl(x.path).data.publicUrl);if(!r.ok)throw new Error("HTTP "+r.status);Z=await JSZip.loadAsync(await r.blob(),{decodeFileName:zdec});
  ZL=Object.values(Z.files).filter(e=>!e.dir&&!zJunk(e.name)).sort((p,q)=>p.name.localeCompare(q.name));const tot=ZL.reduce((s,e)=>s+zsz(e),0);
  $("zs").innerHTML=`${ZL.length} ملف · ${size(tot)} بعد الفك`;
  $("zl").innerHTML=(ZL.length?`<div class="acts" style="margin:8px 0"><button class="p" onclick="zipExtract()">📤 فك ورفع الملفات في الفولدر ده</button></div>`:"")+ZL.slice(0,300).map((e,i)=>{const p=e.name.split("/"),b=p.pop();return`<div class="raised row"><span class="ic">${grp(b)}</span><div class="n"><b>${esc(b)}</b><div class="mu">${esc(p.join("/"))}${p.length?" · ":""}${size(zsz(e))}</div></div>${zPrevOk(b)?`<button class="sm" onclick="zPrev(${i})">👁</button>`:""}<button class="sm" onclick="zDl(${i})">⬇</button></div>`}).join("")+(ZL.length>300?`<p class="mu">معروض أول 300 ملف من ${ZL.length}.</p>`:"")||`<p class="mu">الملف فاضي.</p>`}
 catch(e){$("zs").textContent="مقدرتش أفتح الملف: "+e.message}}
async function zPrev(i){const e=ZL[i],n=e.name.toLowerCase();$("zp").innerHTML="<p class='mu'>...</p>";try{
 if(/\.(png|jpe?g|gif|webp|bmp)$/.test(n)){const b=await e.async("blob");$("zp").innerHTML=`<img alt="" src="${URL.createObjectURL(b)}" style="max-width:100%;border-radius:12px;margin:8px 0">`}
 else{const t=await e.async("string");$("zp").innerHTML=`<pre class="raised card" style="white-space:pre-wrap;text-align:start;direction:auto;max-height:240px;overflow:auto;margin:8px 0">${esc(t.slice(0,20000))}</pre>`}
 $("zp").scrollIntoView({block:"nearest"})}catch(x){$("zp").innerHTML=""; toast("مقدرتش أعرض الملف")}}
async function zDl(i){const e=ZL[i],b=await e.async("blob"),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=e.name.split("/").pop();document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
async function zipExtract(){if(!ZL.length||!ZF)return;const tot=ZL.reduce((s,e)=>s+zsz(e),0);
 if(ZL.length>300)return toast("الملف فيه أكتر من 300 ملف، كتير للفك مرة واحدة");if(tot>209715200)return toast("حجم الملفات بعد الفك أكبر من 200MB");
 if(!confirm(`فك ${ZL.length} ملف ورفعهم في نفس الفولدر؟`))return;const fid=ZF.folder_id;shut();toast("جاري فك الضغط...");const fs=[];
 for(const e of ZL){const b=await e.async("blob");fs.push(new File([b],e.name.split("/").pop(),{type:b.type||"application/octet-stream"}))}await up(fs,fid)}
init();
</script></body></html>
